<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Agent Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1F1E1B;--panel:#292722;--panel2:#302E28;--line:#38352E;--line2:#48443B;
  --ink:#F0EEE6;--sub:#A8A395;--faint:#6B665A;--acc:#D97757;--acc-soft:#E89680;
  --ok:#6FBF8F;--head:rgba(31,30,27,.86);--glow:#3D2A1F;--on-acc:#FFFFFF;
  --shadow:0 12px 40px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(120% 60% at 12% -8%, var(--glow) 0%, transparent 62%),var(--bg);
  color:var(--ink);
  font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
.mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
::selection{background:var(--acc);color:var(--on-acc)}
input,button{font-family:inherit}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---- fixed progress meter ---- */
.meterline{position:fixed;top:0;left:0;right:0;height:2px;background:var(--line);z-index:60}
.meterline i{
  display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--acc),var(--ok));
  box-shadow:0 0 12px rgba(217,119,87,.7);
  transition:width .45s cubic-bezier(.22,1,.36,1);
}

/* ---- sticky header ---- */
header{
  position:sticky;top:0;z-index:40;background:var(--head);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding-top:calc(2px + env(safe-area-inset-top));
}
.rowA{display:flex;align-items:flex-end;gap:16px;padding:16px 0 12px}
.rowA .lead{flex:1;min-width:0}
.eyebrow{
  font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc-soft);
}
.apptitle{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:3px}
.rowA .nums{text-align:right;flex:none}
.pct{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1}
.frac{font-size:11px;color:var(--sub);margin-top:3px}

.rowB{
  display:flex;align-items:center;gap:10px;padding-bottom:12px;
  font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);
}
.rowB .stat{display:flex;gap:6px}
.rowB .div{width:1px;height:10px;background:var(--line2)}
.rowB .ok{color:var(--ok)}
.rowB .ink{color:var(--ink)}
.rowB .stkchip{display:flex;gap:10px;align-items:center;color:var(--acc-soft)}
.themeBtn{
  margin-left:auto;background:none;border:1px solid var(--line2);border-radius:999px;
  color:var(--sub);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  padding:5px 11px;cursor:pointer;
}
.themeBtn:hover,.themeBtn:active{border-color:var(--acc);color:var(--acc-soft)}

.rowC{display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);padding:11px 0}
.rowC input[type=search]{
  flex:1;min-width:0;background:none;border:0;border-bottom:1px solid var(--line2);
  color:var(--ink);font-size:14px;outline:none;padding:4px 0;
}
.rowC input[type=search]:focus{border-bottom-color:var(--acc)}
.rowC input::placeholder{color:var(--faint)}
.seg{display:flex;gap:6px;flex:none}
.seg button{
  border:1px solid var(--line2);background:transparent;color:var(--sub);
  border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;padding:6px 11px;cursor:pointer;
}
.seg button.on{background:var(--acc);color:var(--on-acc)}

.jump{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.jump::-webkit-scrollbar{display:none}
.jump button{
  flex:none;background:transparent;border:1px solid var(--line2);color:var(--sub);
  height:30px;min-width:38px;padding:0 9px;border-radius:8px;cursor:pointer;
  font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-size:11px;font-weight:500;
}
.jump button.started{color:var(--acc-soft)}
.jump button.done-ph{background:rgba(111,191,143,.12);border-color:var(--ok);color:var(--ok)}

/* ---- next up ---- */
.next{
  margin:22px 0 26px;position:relative;padding:18px 20px;
  border:1px solid var(--line2);border-radius:16px;overflow:hidden;cursor:pointer;
  background:linear-gradient(135deg,color-mix(in oklab, var(--acc) 16%, transparent),transparent 60%),var(--panel);
}
.next:hover,.next:active{border-color:var(--acc)}
.next .rail{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc);box-shadow:0 0 18px 2px rgba(217,119,87,.6)}
.next .tag{
  font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--acc-soft);
}
.next .nxt-item{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.next .nxt-phase{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-size:11px;color:var(--sub);margin-top:4px}

/* ---- timeline ---- */
.phase{display:flex;gap:16px;scroll-margin-top:200px}
.spine{flex:none;width:46px;display:flex;flex-direction:column;align-items:center;padding-top:16px}
.node{
  width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--line2);background:var(--panel);color:var(--faint);
  font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-size:14px;font-weight:600;
  transition:all .3s;
}
.phase.started .node{border-color:var(--acc);color:var(--acc-soft);box-shadow:0 0 22px rgba(217,119,87,.35)}
.phase.all-done .node{border-color:var(--ok);background:var(--ok);color:var(--on-acc);box-shadow:0 0 22px rgba(111,191,143,.45)}
.connector{
  flex:1;width:1px;margin:8px 0;min-height:22px;
  background:repeating-linear-gradient(to bottom,var(--line2) 0 5px,transparent 5px 11px);
}
.ph-card-wrap{flex:1;min-width:0;padding:10px 0 22px}
.ph-card{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden;transition:border-color .2s}
.phase.started .ph-card{background:var(--panel2)}
.ph-head{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;user-select:none}
.ph-mid{flex:1;min-width:0}
.ph-title{font-size:16px;font-weight:700;letter-spacing:-.015em;color:var(--ink)}
.phase.all-done .ph-title{color:var(--ok)}
.ph-meta{height:3px;border-radius:3px;background:var(--line);margin-top:9px;max-width:190px;overflow:hidden}
.ph-meta i{display:block;height:100%;border-radius:3px;width:0;background:var(--acc);transition:width .4s cubic-bezier(.22,1,.36,1)}
.ph-meta i.full{background:var(--ok)}
.ph-count{
  flex:none;font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;
}
.ph-count.full{color:var(--ok)}
.ph-caret{flex:none;width:14px;text-align:center;color:var(--faint);font-size:9px;transition:transform .2s}
.phase.open .ph-caret{transform:rotate(90deg)}
.ph-body{display:none;padding:0 18px 8px}
.phase.open .ph-body{display:block}

/* ---- sources ---- */
.res{border-top:1px dashed var(--line2);padding:14px 0 6px}
.res-h{
  font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);margin-bottom:8px;
}
.res-list{display:flex;flex-direction:column;gap:2px}
.res a{
  display:flex;align-items:baseline;gap:10px;padding:7px 0;
  color:var(--ink);text-decoration:none;font-size:13.5px;border-bottom:1px solid var(--line);
}
.res a:hover,.res a:active{color:var(--acc-soft)}
.res .rtag{
  flex:none;min-width:54px;
  font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  font-size:9px;font-weight:500;letter-spacing:.1em;color:var(--faint);
}
.res a.prime .rtag{color:var(--acc-soft)}
.res a.prime .rt{font-weight:700}
.res .rt{flex:1;min-width:0}
.res .ext{color:var(--faint);font-size:11px}

/* ---- topic rows ---- */
.items{display:flex;flex-direction:column;padding:6px 0 8px}
.item{
  display:flex;align-items:center;gap:13px;padding:8px 0;min-height:46px;
  border-top:1px solid var(--line);cursor:pointer;
}
.box{
  flex:none;width:21px;height:21px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--line2);background:transparent;transition:all .16s;
}
.box svg{width:12px;height:12px;opacity:0;transition:opacity .14s}
.box path{stroke:var(--on-acc)}
.item.done .box{
  background:var(--ok);border-color:var(--ok);
  box-shadow:0 0 14px rgba(111,191,143,.35);
  animation:pop .25s cubic-bezier(.22,1.5,.36,1);
}
.item.done .box svg{opacity:1}
.item .txt{flex:1;min-width:0;font-size:14.5px;color:var(--ink)}
.item.done .txt{color:var(--faint);text-decoration:line-through}
.item.hide{display:none}
.itm-ai,.itm-link{
  flex:none;display:flex;align-items:center;justify-content:center;
  height:30px;border:1px solid var(--line2);border-radius:8px;
  background:none;color:var(--sub);cursor:pointer;text-decoration:none;
}
.itm-ai{
  width:40px;font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  font-size:10px;font-weight:600;letter-spacing:.08em;
}
.itm-link{width:30px;font-size:12px}
.itm-ai:hover,.itm-ai:active,.itm-link:hover,.itm-link:active{color:var(--acc-soft);border-color:var(--acc)}

/* ---- footer ---- */
.foot{margin-top:34px;border-top:1px solid var(--line);padding-top:20px;display:flex;gap:10px;justify-content:center}
.foot button{
  background:none;border:1px solid var(--line2);border-radius:999px;color:var(--sub);
  font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  padding:8px 16px;cursor:pointer;
}
.foot button:hover,.foot button:active{color:var(--ink);border-color:var(--acc)}
.foot button#resetBtn{color:var(--faint)}
.foot button#resetBtn:hover,.foot button#resetBtn:active{color:#FF8A8A;border-color:#FF8A8A}
.foot-note{text-align:center;font-size:11.5px;color:var(--faint);line-height:1.8;margin-top:14px}
.empty{padding:40px 0;text-align:center;color:var(--sub);font-size:13px;display:none}

/* ---- toast ---- */
.toast{
  position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:70;
  background:var(--panel2);border:1px solid var(--acc);color:var(--ink);
  padding:11px 18px;border-radius:999px;font-size:12.5px;font-weight:600;
  box-shadow:var(--shadow);max-width:88vw;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.toast.show{opacity:1;animation:rise .22s cubic-bezier(.22,1,.36,1)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</div></header>

<div class="wrap">

    <div class="nxt-phase" id="nxtPhase"></div>
  </div>

  <div class="empty" id="empty">No topics match that search.</div>
  <div class="foot">
    <button id="exportBtn">Export</button>
    <button id="importBtn">Import</button>
    <button id="resetBtn">Reset</button>
    <input type="file" id="importFile" accept=".json" hidden>
  </div>
  <div class="foot-note">AI copies an interactive tutor prompt for that topic — paste it into any chat model.<br>Progress saves on this device. Export / Import moves it between devices.</div>
</div>

  items:["AI Chatbot","PDF Chat","Resume Analyzer","Email Assistant","AI Research Agent","QA Test Case Generator","Bug Report Agent","Jira Assistant","Playwright Test Generator","Multi-Agent QA System","AI Coding Assistant","AI Project Manager","Autonomous Research Agent","AI Software Testing Assistant"]},
 {n:"PF",t:"Final Portfolio Goals",
  res:[
   ["GitHub Pages — free hosting","https://pages.github.com/","TOOL",1],
   ["Hugging Face Spaces — free app hosting","https://huggingface.co/spaces","TOOL"],
   ["Streamlit Community Cloud — free deploys","https://streamlit.io/cloud","TOOL"],
   ["dev.to — free technical blogging","https://dev.to/","TOOL"]
  ],
  items:["Deploy an AI Agent","Deploy a RAG Application","Deploy a Multi-Agent System","Publish on GitHub","Write Technical Blogs","Create LinkedIn Posts","Build Personal Portfolio Website","Complete 5 End-to-End AI Agent Projects"]},
 {n:"MS",t:"Milestones",res:[],
  items:["Understand how LLMs work","Become comfortable with Python and REST APIs","Build an app using an LLM API","Build your first AI Agent","Build a multi-agent system","Deploy an AI Agent publicly","Build an AI-powered QA portfolio"]}
];

const KEY="roadmap.v1";
const THEMES={
  night:{"--bg":"#1F1E1B","--panel":"#292722","--panel2":"#302E28","--line":"#38352E","--line2":"#48443B","--ink":"#F0EEE6","--sub":"#A8A395","--faint":"#6B665A","--acc":"#D97757","--acc-soft":"#E89680","--ok":"#6FBF8F","--head":"rgba(31,30,27,.86)","--glow":"#3D2A1F","--on-acc":"#FFFFFF","--shadow":"0 12px 40px rgba(0,0,0,.55)"},
  day:{"--bg":"#F0EEE6","--panel":"#FCFBF8","--panel2":"#F6F4EC","--line":"#E4E0D4","--line2":"#D2CCBC","--ink":"#1F1E1B","--sub":"#6E6A5E","--faint":"#A6A192","--acc":"#C15F3C","--acc-soft":"#A84E2F","--ok":"#227A4E","--head":"rgba(240,238,230,.88)","--glow":"#F0DACB","--on-acc":"#FFFFFF","--shadow":"0 12px 32px rgba(60,45,30,.14)"}
};

let state=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.checked)return Object.assign({checked:{},days:[],open:{}},s);}catch(e){}
  return {checked:{},days:[],open:{}};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

// normalize items; ids p{phase}i{index} — unchanged since v1, saved progress stays valid
const flat=[];
PHASES.forEach((p,pi)=>p.items.forEach((raw,ii)=>{
  const txt=Array.isArray(raw)?raw[0]:raw;
  const url=Array.isArray(raw)?raw[1]:null;
  flat.push({id:"p"+pi+"i"+ii,pi,ii,txt,url});
}));

const CHECK='<svg viewBox="0 0 16 16" fill="none"><path d="M2.5 8.5l3.5 3.5 7-8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}

const phasesEl=document.getElementById("phases");
PHASES.forEach((p,pi)=>{
  const sec=document.createElement("section");
  sec.className="phase"+(state.open[pi]?" open":"");
  sec.dataset.pi=pi;
  sec.id="phase-"+pi;
  const resHtml=p.res.length?
   '<div class="res"><div class="res-h">Sources</div><div class="res-list">'+
     p.res.map(r=>
       '<a href="'+esc(r[1])+'" target="_blank" rel="noopener"'+(r[3]?' class="prime"':'')+'>'+
         '<span class="rtag">'+r[2]+'</span>'+
         '<span class="rt">'+esc(r[0])+'</span>'+
         '<span class="ext">↗</span>'+
       '</a>').join("")+
   '</div></div>':"";
  const itemsHtml=flat.filter(f=>f.pi===pi).map(f=>
    '<div class="item" data-id="'+f.id+'">'+
      '<span class="box">'+CHECK+'</span>'+
      '<span class="txt">'+esc(f.txt)+'</span>'+
      '<button class="itm-ai" data-ai="'+f.id+'" aria-label="Copy tutor prompt">AI</button>'+
      (f.url?'<a class="itm-link" href="'+esc(f.url)+'" target="_blank" rel="noopener" aria-label="Open resource">↗</a>':'')+
    '</div>').join("");
  sec.innerHTML=
   '<div class="spine"><div class="node mono">'+p.n+'</div><div class="connector"></div></div>'+
   '<div class="ph-card-wrap"><div class="ph-card">'+
     '<div class="ph-head">'+
       '<div class="ph-mid"><div class="ph-title">'+esc(p.t)+'</div><div class="ph-meta"><i></i></div></div>'+
       '<div class="ph-count mono"></div>'+
       '<div class="ph-caret">▶</div>'+
     '</div>'+
     '<div class="ph-body">'+resHtml+'<div class="items">'+itemsHtml+'</div></div>'+
   '</div></div>';
  phasesEl.appendChild(sec);
  sec.querySelector(".ph-head").onclick=()=>{
    sec.classList.toggle("open");
    state.open[pi]=sec.classList.contains("open");save();
  };
});

// ---- AI tutor prompts: generated per topic + phase type ----
const CODE_PHASES=[1,2,3,6,7,8]; // Python, APIs, LLM APIs, Frameworks, DBs, RAG
function buildPrompt(f){
  const topic=f.txt, phase=PHASES[f.pi].t, pi=f.pi;
  if(pi===9)return 'You are my senior AI engineering mentor. I want to build this portfolio project: "'+topic+'". I am learning to become an AI Agent Engineer and I work in Python.\n\nMentor me interactively, one step at a time — never dump the full solution:\n1. Ask me the scoping questions you need (features, which LLM/API keys I have, my current skill level) — as many as you judge necessary.\n2. Help me define a minimal MVP I can finish in a few days, and share the build plan as a short phase list so I know what\'s coming and can pause/resume.\n3. Guide me phase by phase: design → environment setup → core build → testing → polish. One phase at a time; WAIT for me to finish and report back before continuing.\n4. When I paste code or errors, review and debug with explanations, not just corrected code.\n5. If we drift from the plan, keep helping, but end each reply asking whether I want to return to the plan or keep exploring — until we are back on it.\n6. Push me to add a few tests and a README.\n7. If I say "pause", write me a complete ready-to-paste RESUME PROMPT inside a code block — restating your mentor role and these rules, the project, the MVP scope, the phase plan with finished phases marked done, and the exact next step — so I can paste it into a brand-new chat (or continue here) and pick up exactly where we stopped.\n8. At the end, help me deploy it free, draft a short LinkedIn post about it, and list 3 interview talking points from this project.\n\nStart with step 1 now.';
  if(pi===10)return 'You are my career coach for becoming an AI Agent Engineer. My current goal: "'+topic+'".\n\nWork with me interactively:\n1. Ask me the questions you need about my current progress and blockers on this goal.\n2. Build a concrete step-by-step plan with realistic deadlines and show it to me briefly.\n3. Give me ONE small action I can complete today.\n4. Each time I return and report progress, review it honestly and give the next single action.\n\nKeep every reply short and actionable. Start with step 1 now.';
  if(pi===11)return 'You are a strict but fair technical interviewer. Assess whether I have truly reached this milestone of my AI Agent Engineer roadmap: "'+topic+'".\n\nRun an interactive assessment: ask me questions ONE AT A TIME — as many as you need to judge properly — mixing conceptual, practical, and scenario-based. Tell me upfront roughly how many to expect. WAIT for each answer before the next question. Do not reveal answers during the assessment.\n\nAfter the last question: score me out of 10, list my weak areas bluntly, and give a focused 1-week revision plan targeting the gaps. Begin with question 1 now.';
  const code=CODE_PHASES.includes(pi);
  return 'You are an expert personal tutor. I am learning to become an AI Agent Engineer. Today\'s topic: "'+topic+'" — from my roadmap phase "'+phase+'".\n\nTeach me interactively — never lecture-dump:\n1. Start by asking me questions to gauge what I already know about this topic — you decide how many and what to ask.\n2. Based on my answers, show me a brief lesson plan first: the chunks you intend to teach, one line each, sized honestly to the topic — a small topic deserves a short lesson, a big one more chunks. This way I know what is coming and can pause and resume without surprises.\n3. Then teach one chunk at a time — as detailed as the concept needs — each with a simple analogy and one concrete example from real AI-agent building.\n4. After every chunk, ask me exactly ONE check question or micro-exercise. WAIT for my reply before continuing.\n5. If my answer is wrong, give a hint first — reveal the answer only if I miss twice.\n'+(code?'6. Include small hands-on Python exercises I can run locally; when I paste my code, review it and fix mistakes with explanations.\n':'6. Keep it practical — always tie the concept back to how it is used when building real AI agents.\n')+'7. If our discussion drifts away from the planned chunks, keep helping — but end every reply with a quick choice: return to the lesson plan, or keep exploring. Ask this each time until we are back on the plan.\n8. Adapt to me: if I say "faster" compress, if I say "deeper" go deeper. If I say "pause", write me a complete ready-to-paste RESUME PROMPT inside a code block — it must restate your tutor role and all of these teaching rules, the topic, the full lesson plan with covered chunks marked done, the current chunk, and what comes next — so I can paste it into a brand-new chat (or continue in this one) and pick up exactly where we stopped.\n9. When I say "wrap up", finish with: (a) a 5-question quiz, (b) short summary notes I can save, (c) 3 interview questions on this topic with strong answers.\n\nBegin with step 1 now.';
}

const toastEl=document.createElement("div");
toastEl.className="toast";document.body.appendChild(toastEl);
let toastT;
function toast(msg){
  toastEl.textContent=msg;
  toastEl.classList.remove("show");void toastEl.offsetWidth; // restart rise animation
  toastEl.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove("show"),2300);
}
function copyText(t){
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).catch(()=>{});
  const ta=document.createElement("textarea");ta.value=t;
  ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);
  ta.select();try{document.execCommand("copy");}catch(e){}ta.remove();return Promise.resolve();
}
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}

phasesEl.addEventListener("click",e=>{
  const ai=e.target.closest(".itm-ai");
  if(ai){
    e.stopPropagation();
    const f=flat.find(x=>x.id===ai.dataset.ai);
    copyText(buildPrompt(f)).then(()=>{
      toast("Tutor prompt copied — paste into any AI chat");buzz(15);
    });
    return;
  }
  if(e.target.closest("a"))return; // source links: navigate, don't toggle
  const row=e.target.closest(".item");if(!row)return;
  const id=row.dataset.id;
  const wasDone=!!state.checked[id];
  if(wasDone){delete state.checked[id];}
  else{
    state.checked[id]=1;buzz(10);
    const t=today();
    if(!state.days.includes(t))state.days.push(t);
  }
  save();render();
  if(!wasDone){
    const pi=+row.closest(".phase").dataset.pi;
    const phaseFlat=flat.filter(f=>f.pi===pi);
    if(flat.every(f=>state.checked[f.id])){
      toast("Roadmap 100% — AI Agent Engineer");buzz([50,80,50,80,50]);
    }else if(phaseFlat.every(f=>state.checked[f.id])){
      toast(PHASES[pi].t+" — complete");buzz([30,50,30]);
    }
  }
});

// open a phase, then scroll after the body is measurable (per design: no scrollIntoView)
function openAndScroll(pi,id){
  const sec=document.getElementById("phase-"+pi);
  sec.classList.add("open");
  state.open[pi]=true;save();
  setTimeout(()=>{
    const el=(id&&sec.querySelector('.item[data-id="'+id+'"]'))||sec;
    const y=el.getBoundingClientRect().top+window.scrollY-190;
    window.scrollTo({top:y,behavior:"smooth"});
  },60);
}

// phase chips
const jumpEl=document.getElementById("jump");
PHASES.forEach((p,pi)=>{
  const b=document.createElement("button");
  b.textContent=p.n;
  b.title=p.t;
  b.dataset.pi=pi;
  b.onclick=()=>openAndScroll(pi);
  jumpEl.appendChild(b);
});

let filter="all";
const searchEl=document.getElementById("search");
searchEl.oninput=render;
document.querySelectorAll(".seg button").forEach(c=>c.onclick=()=>{
  filter=c.dataset.f;
  document.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x===c));
  render();
});

function streakCount(){
  const set=new Set(state.days);
  let n=0,d=new Date();
  if(!set.has(today()))d.setDate(d.getDate()-1);
  for(;;){
    const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if(set.has(k)){n++;d.setDate(d.getDate()-1);}else break;
  }
  return n;
}

function render(){
  const q=searchEl.value.trim().toLowerCase();
  let done=0,visibleAny=false;
  document.querySelectorAll(".phase").forEach(sec=>{
    const pi=+sec.dataset.pi;
    let pDone=0,pVisible=0;
    sec.querySelectorAll(".item").forEach(row=>{
      const id=row.dataset.id;
      const isDone=!!state.checked[id];
      row.classList.toggle("done",isDone);
      if(isDone){pDone++;done++;}
      const txt=row.querySelector(".txt").textContent.toLowerCase();
      let show=!q||txt.includes(q);
      if(filter==="done")show=show&&isDone;
      if(filter==="todo")show=show&&!isDone;
      row.classList.toggle("hide",!show);
      if(show)pVisible++;
    });
    const total=PHASES[pi].items.length;
    const cnt=sec.querySelector(".ph-count");
    cnt.textContent=pDone+"/"+total;
    cnt.classList.toggle("full",pDone===total);
    const bar=sec.querySelector(".ph-meta i");
    bar.style.width=(pDone/total*100)+"%";
    bar.classList.toggle("full",pDone===total);
    sec.classList.toggle("all-done",pDone===total);
    sec.classList.toggle("started",pDone>0);
    sec.style.display=pVisible?"":"none";
    if(pVisible)visibleAny=true;
    if((q||filter!=="all")&&pVisible)sec.classList.add("open");
    const jb=jumpEl.querySelector('button[data-pi="'+pi+'"]');
    if(jb){
      jb.classList.toggle("done-ph",pDone===total);
      jb.classList.toggle("started",pDone>0&&pDone<total);
    }
  });
  document.getElementById("empty").style.display=visibleAny?"none":"block";

  const total=flat.length;
  const pct=Math.round(done/total*100);
  document.getElementById("doneN").textContent=done;
  document.getElementById("doneN2").textContent=done;
  document.getElementById("leftN").textContent=total-done;
  document.getElementById("totalN").textContent=total;
  document.getElementById("ringPct").textContent=pct+"%";
  document.getElementById("meter").style.width=pct+"%";
  const s=streakCount();
  document.getElementById("streakChip").style.display=s>0?"":"none";
  document.getElementById("streak").textContent="streak "+s+"d";

  const nxt=flat.find(f=>!state.checked[f.id]);
  const card=document.getElementById("nextCard");
  if(nxt&&!q&&filter==="all"){
    card.style.display="";
    document.getElementById("nxtItem").textContent=nxt.txt;
    document.getElementById("nxtPhase").textContent=PHASES[nxt.pi].n+" — "+PHASES[nxt.pi].t;
    card.onclick=()=>openAndScroll(nxt.pi,nxt.id);
  }else card.style.display="none";
}

// theme — "night" | "day" under roadmap.v1.theme; first run follows prefers-color-scheme
const themeBtn=document.getElementById("themeBtn");
let theme=localStorage.getItem(KEY+".theme");
if(theme==="dark")theme="night";     // migrate values from previous versions
if(theme==="light")theme="day";
if(theme!=="night"&&theme!=="day"){
  theme=(matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"day":"night";
}
function applyTheme(){
  const t=THEMES[theme];
  Object.keys(t).forEach(k=>document.documentElement.style.setProperty(k,t[k]));
  themeBtn.textContent=theme==="night"?"Day":"Night";
}
themeBtn.onclick=()=>{
  theme=theme==="night"?"day":"night";
  try{localStorage.setItem(KEY+".theme",theme);}catch(e){}
  applyTheme();
};
applyTheme();

// backup
document.getElementById("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="roadmap-backup.json";
  a.click();URL.revokeObjectURL(a.href);
};
const importFile=document.getElementById("importFile");
document.getElementById("importBtn").onclick=()=>importFile.click();
importFile.onchange=e=>{
  const f=importFile.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const s=JSON.parse(r.result);
      if(!s.checked)throw 0;
      state={checked:s.checked,days:s.days||[],open:s.open||{}};
      save();render();toast("Progress imported");
    }catch(err){toast("That file isn't a valid backup");}
  };
  r.readAsText(f);
  e.target.value="";
};
document.getElementById("resetBtn").onclick=()=>{
  if(confirm("Reset ALL progress? This cannot be undone."))
  {state={checked:{},days:[],open:{}};save();render();toast("Progress cleared");}
};

render();
</script>
